# Traefik v3 — Static Configuration (Local/IP Profile)
# HTTP only on port 80. No TLS. Safe for local development on LAN/localhost.
# For TLS/enterprise profile, see traefik-enterprise.yml.

api:
  dashboard: true
  insecure: true   # dashboard reachable at :8080 — disable in production

entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        # 0 = no limit. Required for very large file uploads/downloads.
        # Default (60s) kills connections at ~60 s regardless of body size.
        readTimeout: 0
        writeTimeout: 0
    # Only trust X-Forwarded-* headers from Docker-internal IPs (Traefik itself).
    # This prevents clients from spoofing X-Forwarded-For / X-Real-IP to bypass
    # rate limiting or appear as a different IP address.
    forwardedHeaders:
      insecure: false
      trustedIPs:
        - "127.0.0.1/32"
        - "172.16.0.0/12"   # Docker bridge networks (172.16–172.31)

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: tenzoshare-net
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog:
  format: json

metrics:
  prometheus:
    entryPoint: traefik   # exposed on the :8080 dashboard port — internal only

# Ping endpoint used by Docker healthcheck
ping:
  entryPoint: web
